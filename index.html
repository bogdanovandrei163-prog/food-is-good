<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой планировщик питания</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --border: #e0e6ed;
            --danger: #e74c3c;
            --success: #2ecc71;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            line-height: 1.5;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 25px; color: var(--text); font-weight: 700; }
        h2 { margin-bottom: 15px; font-size: 1.3rem; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        /* --- Экран авторизации --- */
        .auth-screen {
            position: fixed; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 20px;
            z-index: 100;
        }
        .auth-card {
            background: white; border-radius: 16px; padding: 36px 32px;
            width: 100%; max-width: 420px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .auth-card h1 { margin-bottom: 24px; text-align: center; font-size: 1.35rem; }
        .auth-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .auth-tabs .tab {
            flex: 1; padding: 10px; border: 1px solid var(--border);
            background: white; border-radius: 8px; cursor: pointer;
            font-weight: 600; color: #666; font-size: 0.95rem;
            transition: all 0.15s;
        }
        .auth-tabs .tab:hover { border-color: var(--accent); color: var(--accent); }
        .auth-tabs .tab.active { background: var(--accent); color: white; border-color: var(--accent); }
        .auth-card form { display: flex; flex-direction: column; gap: 12px; }
        .auth-card form input {
            padding: 12px; border: 1px solid var(--border); border-radius: 8px;
            font-size: 1rem; width: 100%; font-family: inherit;
        }
        .auth-card form input:focus { outline: none; border-color: var(--accent); }
        .auth-card form button[type=submit] {
            padding: 12px; background: var(--accent); color: white; border: none;
            border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer;
            transition: background 0.15s;
        }
        .auth-card form button[type=submit]:hover { background: var(--accent-hover); }
        .error { color: var(--danger); font-size: 0.85rem; min-height: 1.2em; text-align: center; }

        /* --- Верхняя панель --- */
        .top-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: white; padding: 12px 20px; border-radius: 12px;
            margin-bottom: 20px; border: 1px solid var(--border);
            flex-wrap: wrap; gap: 10px;
        }
        .top-bar .account-info { font-size: 0.95rem; color: #555; }
        .logout-btn {
            padding: 8px 16px; background: var(--danger); color: white;
            border: none; border-radius: 8px; cursor: pointer; font-weight: 600;
            transition: background 0.15s;
        }
        .logout-btn:hover { background: #c0392b; }

        /* --- Форма продукта --- */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 5px;
        }
        .form-grid input, .form-grid select {
            width: 100%; padding: 10px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 0.95rem; font-family: inherit;
        }
        .form-grid input:focus, .form-grid select:focus { outline: none; border-color: var(--accent); }
        .form-grid button {
            padding: 10px 15px; background: var(--accent); color: white; border: none;
            border-radius: 8px; cursor: pointer; font-weight: 600;
            transition: background 0.15s; font-family: inherit;
        }
        .form-grid button:hover { background: var(--accent-hover); }

        /* --- Таблицы --- */
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f8fafc; font-weight: 600; }

        /* --- Меню --- */
        .meal-section { margin-bottom: 25px; }
        .meal-header {
            display: flex; justify-content: space-between; align-items: center;
            background: #eaf2f8; padding: 8px 12px; border-radius: 8px;
            margin-bottom: 10px; font-weight: 600; flex-wrap: wrap; gap: 6px;
        }
        .meal-total { font-size: 0.9rem; color: #555; font-weight: normal; }
        .add-item-row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
        .add-item-row select, .add-item-row input {
            padding: 8px; border: 1px solid var(--border);
            border-radius: 6px; font-size: 0.9rem; font-family: inherit;
        }
        .add-item-row button {
            padding: 8px 12px; background: var(--success); color: white; border: none;
            border-radius: 6px; cursor: pointer; font-weight: 600;
            font-family: inherit;
        }
        .add-item-row button:hover { background: #27ae60; }

        /* --- Итоги дня --- */
        .day-summary {
            background: #2c3e50; color: white; padding: 20px; border-radius: 12px;
            display: flex; justify-content: space-around; flex-wrap: wrap;
            gap: 15px; margin-top: 20px;
        }
        .summary-item { text-align: center; min-width: 100px; }
        .summary-item .label {
            font-size: 0.75rem; opacity: 0.8;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .summary-item .value { font-size: 1.8rem; font-weight: 700; line-height: 1.2; }
        .summary-item .target { font-size: 0.75rem; opacity: 0.7; margin-top: 2px; }

        /* --- Кнопка удаления --- */
        .delete-btn {
            background: var(--danger); color: white; border: none;
            border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 0.8rem;
            font-family: inherit;
        }
        .delete-btn:hover { background: #c0392b; }
        .empty-msg { color: #888; font-style: italic; padding: 10px; }

        /* --- Пользователи --- */
        .users-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 12px; margin-bottom: 15px;
        }
        .user-card {
            background: #f8fafc; border: 2px solid var(--border);
            border-radius: 10px; padding: 12px; cursor: pointer;
            transition: all 0.15s;
        }
        .user-card:hover { border-color: var(--accent); }
        .user-card.active { border-color: var(--accent); background: #eaf2f8; }
        .user-name { font-weight: 600; margin-bottom: 4px; display: flex; justify-content: space-between; gap: 8px; }
        .user-name .check { color: var(--success); font-weight: 700; }
        .user-info { font-size: 0.85rem; color: #666; margin-bottom: 4px; }
        .user-targets { font-size: 0.8rem; color: #888; margin-bottom: 8px; }
        .add-user-btn {
            padding: 10px 16px; background: var(--accent); color: white; border: none;
            border-radius: 8px; cursor: pointer; font-weight: 600; font-family: inherit;
        }
        .add-user-btn:hover { background: var(--accent-hover); }
        .cancel-btn {
            padding: 10px 16px; background: #95a5a6; color: white; border: none;
            border-radius: 8px; cursor: pointer; font-weight: 600;
            margin-left: 8px; font-family: inherit;
        }
        .cancel-btn:hover { background: #7f8c8d; }
        .add-user-form {
            margin-top: 15px; padding: 15px; background: #f8fafc;
            border-radius: 10px; border: 1px solid var(--border);
        }
        .add-user-form .form-grid { margin-bottom: 0; }
        .add-user-form .actions { margin-top: 12px; }

        #activeUserLabel { font-size: 0.85rem; font-weight: normal; color: #666; }
    </style>
</head>
<body>

<!-- ======================= ЭКРАН АВТОРИЗАЦИИ ======================= -->
<div id="authScreen" class="auth-screen" style="display:none;">
    <div class="auth-card">
        <h1>🥗 Планировщик питания</h1>

        <div class="auth-tabs">
            <button type="button" id="tabLogin" class="tab active" onclick="switchAuthTab('login')">Вход</button>
            <button type="button" id="tabRegister" class="tab" onclick="switchAuthTab('register')">Регистрация</button>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <input type="text" id="loginUsername" placeholder="Логин" autocomplete="username" required>
            <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password" required>
            <div id="loginError" class="error"></div>
            <button type="submit">Войти</button>
        </form>

        <form id="registerForm" onsubmit="handleRegister(event)" style="display:none;">
            <input type="text" id="regUsername" placeholder="Логин" autocomplete="username" required>
            <input type="password" id="regPassword" placeholder="Пароль (мин. 3 символа)" autocomplete="new-password" required minlength="3">
            <input type="password" id="regPasswordConfirm" placeholder="Повторите пароль" autocomplete="new-password" required>
            <div id="regError" class="error"></div>
            <button type="submit">Создать аккаунт</button>
        </form>
    </div>
</div>

<!-- ======================= ОСНОВНОЕ ПРИЛОЖЕНИЕ ======================= -->
<div id="appScreen" class="container" style="display:none;">

    <div class="top-bar">
        <span class="account-info">Вы вошли как <strong id="currentAccountName"></strong></span>
        <button class="logout-btn" onclick="handleLogout()">Выйти</button>
    </div>

    <h1>🥗 Мой планировщик питания</h1>

    <!-- ---- Пользователи ---- -->
    <div class="card">
        <h2>Пользователи (профили питания)</h2>
        <div id="usersList"></div>
        <button class="add-user-btn" onclick="showAddUserForm()">+ Добавить пользователя</button>

        <div id="addUserForm" class="add-user-form" style="display:none;">
            <div class="form-grid">
                <input type="text" id="newUserName" placeholder="ФИО">
                <select id="newUserGender">
                    <option value="">Пол</option>
                    <option value="male">Мужской</option>
                    <option value="female">Женский</option>
                </select>
                <input type="number" id="newUserAge" placeholder="Возраст" min="0" max="150">
                <input type="number" id="newUserProtein" placeholder="Белок (г/день)" step="0.1" min="0">
                <input type="number" id="newUserFiber" placeholder="Клетчатка (г/день)" step="0.1" min="0">
                <input type="number" id="newUserKcal" placeholder="Ккал/день" step="1" min="0">
            </div>
            <div class="actions">
                <button class="add-user-btn" onclick="addUser()">Сохранить</button>
                <button class="cancel-btn" onclick="hideAddUserForm()">Отмена</button>
            </div>
        </div>
    </div>

    <!-- ---- Добавление продукта ---- -->
    <div class="card">
        <h2>Добавить продукт в справочник</h2>
        <div class="form-grid">
            <input type="text" id="prodName" placeholder="Название продукта">
            <input type="text" id="prodStore" placeholder="Магазин">
            <input type="number" id="prodProtein" placeholder="Белок (г) на 100г" step="0.1" min="0">
            <input type="number" id="prodFiber" placeholder="Клетчатка (г) на 100г" step="0.1" min="0">
            <input type="number" id="prodKcal" placeholder="Ккал на 100г" step="1" min="0">
            <button onclick="addProduct()">Добавить продукт</button>
        </div>
    </div>

    <!-- ---- Справочник ---- -->
    <div class="card">
        <h2>Справочник продуктов</h2>
        <div id="productsList"></div>
    </div>

    <!-- ---- Меню на день ---- -->
    <div class="card">
        <h2>Меню на день <span id="activeUserLabel"></span></h2>
        <div id="mealsContainer"></div>
        <div class="day-summary">
            <div class="summary-item">
                <div class="label">Итого грамм</div>
                <div class="value" id="totalGrams">0</div>
            </div>
            <div class="summary-item">
                <div class="label">Белок (г)</div>
                <div class="value" id="totalProtein">0</div>
                <div class="target" id="targetProtein"></div>
            </div>
            <div class="summary-item">
                <div class="label">Клетчатка (г)</div>
                <div class="value" id="totalFiber">0</div>
                <div class="target" id="targetFiber"></div>
            </div>
            <div class="summary-item">
                <div class="label">Ккал</div>
                <div class="value" id="totalKcal">0</div>
                <div class="target" id="targetKcal"></div>
            </div>
        </div>
    </div>
</div>

<script>
/* ============================================================
   ХРАНИЛИЩЕ И КЛЮЧИ
   ============================================================ */
const STORAGE_ACCOUNTS = 'np_accounts_v2';
const STORAGE_SESSION  = 'np_session_v2';
const STORAGE_DATA     = 'np_data_v2';

// Текущее состояние
let currentAccount = null;   // username залогиненного аккаунта
let accountData    = null;   // данные текущего аккаунта

/* ============================================================
   УТИЛИТЫ
   ============================================================ */
function simpleHash(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
    }
    return 'h' + Math.abs(hash).toString(36);
}
function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}

/* ============================================================
   ХРАНИЛИЩЕ — низкоуровневые функции
   ============================================================ */
function loadAccounts() {
    try { return JSON.parse(localStorage.getItem(STORAGE_ACCOUNTS)) || []; }
    catch (e) { return []; }
}
function saveAccounts(list) {
    localStorage.setItem(STORAGE_ACCOUNTS, JSON.stringify(list));
}
function loadSession() {
    try { return JSON.parse(localStorage.getItem(STORAGE_SESSION)) || null; }
    catch (e) { return null; }
}
function saveSession(s) {
    localStorage.setItem(STORAGE_SESSION, JSON.stringify(s));
}
function clearSession() {
    localStorage.removeItem(STORAGE_SESSION);
}
function loadAllData() {
    try { return JSON.parse(localStorage.getItem(STORAGE_DATA)) || {}; }
    catch (e) { return {}; }
}
function saveAllData(data) {
    localStorage.setItem(STORAGE_DATA, JSON.stringify(data));
}

/* ============================================================
   ДАННЫЕ АККАУНТА
   ============================================================ */
function getDefaultMeals() {
    return {
        breakfast: { name: 'Завтрак', time: '08:00', items: [] },
        snack1:    { name: 'Перекус',  time: '11:00', items: [] },
        lunch:     { name: 'Обед',     time: '14:00', items: [] },
        snack2:    { name: 'Полдник',  time: '17:00', items: [] },
        dinner:    { name: 'Ужин',     time: '19:00', items: [] }
    };
}

function getSampleProducts() {
    return [
        { id: 1, name: 'Куриная грудка', store: 'Пятерочка', protein: 23.6, fiber: 0,    kcal: 113 },
        { id: 2, name: 'Гречка (вареная)', store: 'Магнит',  protein: 3.4,  fiber: 2.7,  kcal: 110 },
        { id: 3, name: 'Яйцо куриное',    store: 'Перекресток', protein: 12.7, fiber: 0, kcal: 143 },
        { id: 4, name: 'Овсяные хлопья',  store: 'Лента',    protein: 13.1, fiber: 10.6, kcal: 352 }
    ];
}

function initAccountData(username) {
    const firstUserId = Date.now();

    // Миграция старых продуктов, если есть
    let products = getSampleProducts();
    try {
        const old = JSON.parse(localStorage.getItem('products'));
        if (Array.isArray(old) && old.length > 0) products = old;
    } catch (e) {}

    return {
        products: products,
        users: [{
            id: firstUserId,
            name: username,
            gender: '',
            age: 0,
            targetProtein: 0,
            targetFiber: 0,
            targetKcal: 0
        }],
        activeUserId: firstUserId,
        menus: { [firstUserId]: getDefaultMeals() }
    };
}

function persistData() {
    if (!currentAccount || !accountData) return;
    const all = loadAllData();
    all[currentAccount] = accountData;
    saveAllData(all);
}

/* ============================================================
   АВТОРИЗАЦИЯ
   ============================================================ */
function switchAuthTab(tab) {
    document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
    document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
    document.getElementById('loginForm').style.display    = tab === 'login'    ? 'flex' : 'none';
    document.getElementById('registerForm').style.display = tab === 'register' ? 'flex' : 'none';
    document.getElementById('loginError').textContent = '';
    document.getElementById('regError').textContent   = '';
}

function showAuth() {
    document.getElementById('authScreen').style.display = 'flex';
    document.getElementById('appScreen').style.display  = 'none';

    // Если аккаунтов нет — сразу открываем вкладку регистрации
    if (loadAccounts().length === 0) {
        switchAuthTab('register');
    } else {
        switchAuthTab('login');
    }
}

function showApp() {
    document.getElementById('authScreen').style.display = 'none';
    document.getElementById('appScreen').style.display  = 'block';
    document.getElementById('currentAccountName').textContent = currentAccount;
    renderUsers();
    renderAll();
}

function handleLogin(e) {
    e.preventDefault();
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;

    const accounts = loadAccounts();
    const acc = accounts.find(a => a.username === username);
    if (!acc) {
        document.getElementById('loginError').textContent = 'Пользователь не найден';
        return;
    }
    if (acc.passwordHash !== simpleHash(password)) {
        document.getElementById('loginError').textContent = 'Неверный пароль';
        return;
    }
    loginSuccess(username);
}

function handleRegister(e) {
    e.preventDefault();
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value;
    const confirm  = document.getElementById('regPasswordConfirm').value;
    const errEl    = document.getElementById('regError');

    if (!username) { errEl.textContent = 'Введите логин'; return; }
    if (password.length < 3) { errEl.textContent = 'Пароль слишком короткий'; return; }
    if (password !== confirm) { errEl.textContent = 'Пароли не совпадают'; return; }

    const accounts = loadAccounts();
    if (accounts.find(a => a.username === username)) {
        errEl.textContent = 'Такой логин уже существует';
        return;
    }

    accounts.push({
        username,
        passwordHash: simpleHash(password),
        createdAt: Date.now()
    });
    saveAccounts(accounts);

    // Инициализация данных для нового аккаунта
    const all = loadAllData();
    if (!all[username]) {
        all[username] = initAccountData(username);
        saveAllData(all);
    }

    loginSuccess(username);
}

function loginSuccess(username) {
    currentAccount = username;
    saveSession({ username });
    const all = loadAllData();
    accountData = all[username];
    showApp();
}

function handleLogout() {
    clearSession();
    currentAccount = null;
    accountData = null;
    document.getElementById('loginForm').reset();
    document.getElementById('registerForm').reset();
    hideAddUserForm();
    showAuth();
}

/* ============================================================
   ПОЛЬЗОВАТЕЛИ (профили питания внутри аккаунта)
   ============================================================ */
function showAddUserForm() {
    document.getElementById('addUserForm').style.display = 'block';
}
function hideAddUserForm() {
    document.getElementById('addUserForm').style.display = 'none';
    ['newUserName','newUserGender','newUserAge','newUserProtein','newUserFiber','newUserKcal']
        .forEach(id => document.getElementById(id).value = '');
}

function addUser() {
    const name = document.getElementById('newUserName').value.trim();
    if (!name) { alert('Введите ФИО пользователя'); return; }

    const newUser = {
        id: Date.now(),
        name,
        gender: document.getElementById('newUserGender').value,
        age: parseFloat(document.getElementById('newUserAge').value) || 0,
        targetProtein: parseFloat(document.getElementById('newUserProtein').value) || 0,
        targetFiber:   parseFloat(document.getElementById('newUserFiber').value)   || 0,
        targetKcal:    parseFloat(document.getElementById('newUserKcal').value)    || 0
    };

    accountData.users.push(newUser);
    accountData.menus[newUser.id] = getDefaultMeals();
    if (!accountData.activeUserId) accountData.activeUserId = newUser.id;

    persistData();
    hideAddUserForm();
    renderUsers();
    renderAll();
}

function deleteUser(userId) {
    if (accountData.users.length <= 1) {
        alert('Нельзя удалить единственного пользователя');
        return;
    }
    const user = accountData.users.find(u => u.id === userId);
    if (!confirm(`Удалить пользователя «${user ? user.name : ''}» и его меню?`)) return;

    accountData.users = accountData.users.filter(u => u.id !== userId);
    delete accountData.menus[userId];

    if (accountData.activeUserId === userId) {
        accountData.activeUserId = accountData.users[0].id;
    }
    persistData();
    renderUsers();
    renderAll();
}

function setActiveUser(userId) {
    accountData.activeUserId = userId;
    persistData();
    renderUsers();
    renderAll();
}

function renderUsers() {
    const container = document.getElementById('usersList');
    if (!accountData.users.length) {
        container.innerHTML = '<div class="empty-msg">Нет пользователей. Добавьте первого.</div>';
        return;
    }

    let html = '<div class="users-grid">';
    accountData.users.forEach(u => {
        const isActive = u.id === accountData.activeUserId;
        const genderLabel = u.gender === 'male' ? 'М' : (u.gender === 'female' ? 'Ж' : '—');
        html += `
            <div class="user-card ${isActive ? 'active' : ''}" onclick="setActiveUser(${u.id})">
                <div class="user-name">
                    <span>${escapeHtml(u.name)}</span>
                    ${isActive ? '<span class="check">✓</span>' : ''}
                </div>
                <div class="user-info">${genderLabel}, ${u.age || '—'} лет</div>
                <div class="user-targets">
                    Б: ${u.targetProtein || 0} · Кл: ${u.targetFiber || 0} · ${u.targetKcal || 0} ккал
                </div>
                <button class="delete-btn"
                        onclick="event.stopPropagation(); deleteUser(${u.id})">✕ Удалить</button>
            </div>`;
    });
    html += '</div>';
    container.innerHTML = html;
}

/* ============================================================
   АКТИВНОЕ МЕНЮ
   ============================================================ */
function getActiveMeals() {
    if (!accountData.activeUserId) return null;
    if (!accountData.menus[accountData.activeUserId]) {
        accountData.menus[accountData.activeUserId] = getDefaultMeals();
    }
    return accountData.menus[accountData.activeUserId];
}

/* ============================================================
   ПРОДУКТЫ (общие для аккаунта)
   ============================================================ */
function addProduct() {
    const name    = document.getElementById('prodName').value.trim();
    const store   = document.getElementById('prodStore').value.trim();
    const protein = parseFloat(document.getElementById('prodProtein').value) || 0;
    const fiber   = parseFloat(document.getElementById('prodFiber').value)   || 0;
    const kcal    = parseFloat(document.getElementById('prodKcal').value)    || 0;

    if (!name) { alert('Введите название продукта'); return; }

    accountData.products.push({ id: Date.now(), name, store, protein, fiber, kcal });
    persistData();
    renderAll();

    ['prodName','prodStore','prodProtein','prodFiber','prodKcal']
        .forEach(id => document.getElementById(id).value = '');
}

function deleteProduct(id) {
    if (!confirm('Удалить продукт из справочника?')) return;
    accountData.products = accountData.products.filter(p => p.id !== id);

    // Убираем из меню всех пользователей аккаунта
    Object.keys(accountData.menus).forEach(userId => {
        const menu = accountData.menus[userId];
        Object.keys(menu).forEach(mealKey => {
            menu[mealKey].items = menu[mealKey].items.filter(i => i.productId !== id);
        });
    });

    persistData();
    renderAll();
}

function renderProducts() {
    const container = document.getElementById('productsList');
    if (!accountData.products.length) {
        container.innerHTML = '<div class="empty-msg">Справочник пуст. Добавьте продукты выше.</div>';
        return;
    }
    let html = `<table><thead><tr>
        <th>Название</th><th>Магазин</th><th>Белок/100г</th>
        <th>Клетчатка/100г</th><th>Ккал/100г</th><th></th>
    </tr></thead><tbody>`;
    accountData.products.forEach(p => {
        html += `<tr>
            <td><strong>${escapeHtml(p.name)}</strong></td>
            <td>${escapeHtml(p.store || '—')}</td>
            <td>${p.protein}</td>
            <td>${p.fiber}</td>
            <td>${p.kcal}</td>
            <td><button class="delete-btn" onclick="deleteProduct(${p.id})">✕</button></td>
        </tr>`;
    });
    html += `</tbody></table>`;
    container.innerHTML = html;
}

/* ============================================================
   МЕНЮ
   ============================================================ */
function addItemToMeal(mealKey) {
    const meals = getActiveMeals();
    if (!meals) { alert('Сначала добавьте пользователя'); return; }

    const select     = document.getElementById(`select-${mealKey}`);
    const gramsInput = document.getElementById(`grams-${mealKey}`);
    const productId  = parseInt(select.value);
    const grams      = parseFloat(gramsInput.value);

    if (!productId) { alert('Выберите продукт'); return; }
    if (!grams || grams <= 0) { alert('Введите корректное количество грамм'); return; }

    const product = accountData.products.find(p => p.id === productId);
    if (!product) return;

    meals[mealKey].items.push({ productId: product.id, grams });
    persistData();
    renderAll();

    gramsInput.value = '';
    select.value = '';
}

function removeItem(mealKey, index) {
    const meals = getActiveMeals();
    if (!meals) return;
    meals[mealKey].items.splice(index, 1);
    persistData();
    renderAll();
}

function calculateMealTotals(mealKey) {
    const meals = getActiveMeals();
    let totalGrams = 0, totalProtein = 0, totalFiber = 0, totalKcal = 0;
    if (!meals) return { totalGrams, totalProtein, totalFiber, totalKcal };

    meals[mealKey].items.forEach(item => {
        const p = accountData.products.find(prod => prod.id === item.productId);
        if (!p) return;
        const factor = item.grams / 100;
        totalGrams   += item.grams;
        totalProtein += p.protein * factor;
        totalFiber   += p.fiber   * factor;
        totalKcal    += p.kcal    * factor;
    });
    return { totalGrams, totalProtein, totalFiber, totalKcal };
}

function renderMeals() {
    const container = document.getElementById('mealsContainer');
    const meals = getActiveMeals();

    // Обновляем подпись активного пользователя
    const activeUser = accountData.users.find(u => u.id === accountData.activeUserId);
    document.getElementById('activeUserLabel').textContent =
        activeUser ? `— ${activeUser.name}` : '';

    if (!meals) {
        container.innerHTML = '<div class="empty-msg">Добавьте пользователя, чтобы составить меню.</div>';
        return;
    }

    let html = '';
    Object.keys(meals).forEach(key => {
        const meal   = meals[key];
        const totals = calculateMealTotals(key);

        html += `<div class="meal-section">`;
        html += `<div class="meal-header">
            <span>${meal.name} (${meal.time})</span>
            <span class="meal-total">
                Итого: ${totals.totalGrams.toFixed(0)} г |
                Б: ${totals.totalProtein.toFixed(1)} г |
                Кл: ${totals.totalFiber.toFixed(1)} г |
                ${totals.totalKcal.toFixed(0)} ккал
            </span>
        </div>`;

        if (meal.items.length === 0) {
            html += `<div class="empty-msg" style="padding-left:10px;">Нет продуктов</div>`;
        } else {
            html += `<table><thead><tr>
                <th>Продукт</th><th>Грамм</th><th>Белок</th>
                <th>Клетчатка</th><th>Ккал</th><th></th>
            </tr></thead><tbody>`;
            meal.items.forEach((item, idx) => {
                const p = accountData.products.find(prod => prod.id === item.productId);
                if (!p) return;
                const factor = item.grams / 100;
                html += `<tr>
                    <td>${escapeHtml(p.name)}</td>
                    <td>${item.grams} г</td>
                    <td>${(p.protein * factor).toFixed(1)} г</td>
                    <td>${(p.fiber   * factor).toFixed(1)} г</td>
                    <td>${(p.kcal    * factor).toFixed(0)} ккал</td>
                    <td><button class="delete-btn"
                                onclick="removeItem('${key}', ${idx})">✕</button></td>
                </tr>`;
            });
            html += `</tbody></table>`;
        }

        html += `<div class="add-item-row">
            <select id="select-${key}">
                <option value="">-- Выберите продукт --</option>
                ${accountData.products.map(p =>
                    `<option value="${p.id}">${escapeHtml(p.name)} (${p.kcal} ккал/100г)</option>`
                ).join('')}
            </select>
            <input type="number" id="grams-${key}" placeholder="Грамм" style="width:90px;" min="1">
            <button onclick="addItemToMeal('${key}')">+ Добавить</button>
        </div>`;

        html += `</div>`;
    });

    container.innerHTML = html;
}

/* ============================================================
   ИТОГИ ЗА ДЕНЬ
   ============================================================ */
function updateDaySummary() {
    const meals = getActiveMeals();
    let totalGrams = 0, totalProtein = 0, totalFiber = 0, totalKcal = 0;

    if (meals) {
        Object.keys(meals).forEach(key => {
            const t = calculateMealTotals(key);
            totalGrams   += t.totalGrams;
            totalProtein += t.totalProtein;
            totalFiber   += t.totalFiber;
            totalKcal    += t.totalKcal;
        });
    }

    document.getElementById('totalGrams').textContent   = totalGrams.toFixed(0);
    document.getElementById('totalProtein').textContent = totalProtein.toFixed(1);
    document.getElementById('totalFiber').textContent   = totalFiber.toFixed(1);
    document.getElementById('totalKcal').textContent    = totalKcal.toFixed(0);

    // Цели активного пользователя
    const u = accountData.users.find(usr => usr.id === accountData.activeUserId);
    document.getElementById('targetProtein').textContent = (u && u.targetProtein) ? `цель: ${u.targetProtein} г` : '';
    document.getElementById('targetFiber').textContent   = (u && u.targetFiber)   ? `цель: ${u.targetFiber} г`   : '';
    document.getElementById('targetKcal').textContent    = (u && u.targetKcal)    ? `цель: ${u.targetKcal} ккал`  : '';
}

/* ============================================================
   ОБЩАЯ ОТРИСОВКА
   ============================================================ */
function renderAll() {
    renderProducts();
    renderMeals();
    updateDaySummary();
}

/* ============================================================
   ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ
   ============================================================ */
(function init() {
    const session  = loadSession();
    const accounts = loadAccounts();

    if (session && accounts.find(a => a.username === session.username)) {
        const all = loadAllData();
        if (all[session.username]) {
            currentAccount = session.username;
            accountData    = all[session.username];
            showApp();
            return;
        }
    }
    // Сессия невалидна или отсутствует
    clearSession();
    showAuth();
})();
</script>
