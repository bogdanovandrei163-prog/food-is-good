<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Мой планировщик питания</title>
<style>
:root{--bg:#f4f7f6;--card-bg:#fff;--text:#2c3e50;--accent:#3498db;--accent-hover:#2980b9;--border:#e0e6ed;--danger:#e74c3c;--success:#2ecc71}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:20px;line-height:1.5;min-height:100vh}
.container{max-width:1100px;margin:0 auto}
h1{text-align:center;margin-bottom:25px;font-weight:700}
h2{margin-bottom:15px;font-size:1.3rem;border-bottom:2px solid var(--border);padding-bottom:8px}
h3{margin-bottom:15px;font-size:1.15rem}
.card{background:var(--card-bg);border-radius:12px;box-shadow:0 4px 6px rgba(0,0,0,.05);padding:20px;margin-bottom:20px;border:1px solid var(--border)}
.hidden{display:none!important}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
.auth-screen{min-height:80vh;display:flex;align-items:center;justify-content:center}
.auth-screen .container{width:100%;max-width:440px}
.auth-card{background:var(--card-bg);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.08);padding:24px;border:1px solid var(--border)}
.auth-tabs{display:flex;gap:4px;margin-bottom:20px;background:#f0f4f8;border-radius:10px;padding:4px}
.auth-tab{flex:1;padding:10px;background:transparent;border:none;border-radius:8px;font-weight:600;font-size:.95rem;color:var(--text);transition:background .2s}
.auth-tab.active{background:var(--card-bg);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.auth-panel{display:flex;flex-direction:column;gap:12px}
.auth-panel input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:8px;font-size:1rem}
.auth-panel .primary-btn{padding:12px;font-size:1rem}
.auth-error{color:var(--danger);font-size:.9rem;min-height:20px}

/* --- HEADER & BURGER MENU --- */
.app-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:20px}
.header-left{display:flex;align-items:center;gap:15px}
.app-header h1{text-align:left;margin:0;font-size:1.5rem}
.burger-btn{background:none;border:none;font-size:1.8rem;color:var(--text);padding:0;display:flex;align-items:center;justify-content:center;transition:color .2s;line-height:1}
.burger-btn:hover{color:var(--accent)}
.user-info{display:flex;align-items:center;gap:12px;background:var(--card-bg);padding:8px 14px;border-radius:999px;border:1px solid var(--border);font-size:.9rem}

.sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:150;opacity:0;pointer-events:none;transition:opacity .3s}
.sidebar-overlay.open{opacity:1;pointer-events:auto}
.sidebar{position:fixed;top:0;left:-300px;width:280px;height:100vh;background:var(--card-bg);z-index:200;box-shadow:2px 0 15px rgba(0,0,0,.1);transition:left .3s ease;display:flex;flex-direction:column;padding:20px}
.sidebar.open{left:0}
.sidebar-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding-bottom:15px;border-bottom:1px solid var(--border)}
.sidebar-title{font-weight:700;font-size:1.2rem}
.close-btn{background:none;border:none;font-size:1.5rem;color:#888;cursor:pointer}
.close-btn:hover{color:var(--danger)}
.sidebar-nav{display:flex;flex-direction:column;gap:8px}
.sidebar-nav .tab{padding:12px 16px;border-radius:8px;font-size:1rem;font-weight:600;text-decoration:none;color:var(--text);transition:background .2s,color .2s;border:1px solid transparent}
.sidebar-nav .tab:hover{background:#f0f4f8}
.sidebar-nav .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:15px}
.form-grid input,.form-grid select{width:100%;padding:10px;border:1px solid var(--border);border-radius:8px;font-size:.95rem}
.form-grid label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:#555}
.primary-btn{padding:10px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-weight:600;font-size:.95rem;transition:background .2s}
.primary-btn:hover{background:var(--accent-hover)}
.small-btn{padding:6px 12px;border:1px solid var(--border);background:#fff;color:var(--text);border-radius:6px;font-size:.85rem;font-weight:600}
.small-btn:hover{background:#f8fafc}
.small-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.small-btn.primary:hover{background:var(--accent-hover)}
.delete-btn{background:var(--danger);color:#fff;border:none;border-radius:4px;padding:6px 12px;font-size:.85rem;font-weight:600}
.delete-btn:hover{background:#c0392b}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:.9rem}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border);vertical-align:middle}
th{background:#f8fafc;font-weight:600;font-size:.85rem}
.section{display:none}
.section.active{display:block}
.empty-msg{color:#888;font-style:italic;padding:10px}
.norms{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.norm{background:#eaf2f8;border-radius:10px;padding:15px;text-align:center}
.norm .label{font-size:.8rem;color:#555;text-transform:uppercase;letter-spacing:1px}
.norm .value{font-size:1.6rem;font-weight:700}

/* --- СТИЛИ ДЛЯ ПРОДУКТОВ --- */
.store-group{margin-bottom:18px}
.store-header{display:flex;justify-content:space-between;align-items:center;background:#eaf2f8;padding:10px 14px;border-radius:10px 10px 0 0;font-weight:700;border:1px solid var(--border);border-bottom:none}
.store-body{border:1px solid var(--border);border-radius:0;overflow-x:auto;border-bottom:none;}
.store-body table{margin:0}
.store-bottom-total{display:flex;justify-content:space-between;align-items:center;background:#f0f4f8;padding:12px 16px;border-radius:0 0 10px 10px;font-weight:700;font-size:1rem;border:1px solid var(--border);}
.grand-total{display:flex;justify-content:space-between;align-items:center;background:#2c3e50;color:#fff;padding:16px 20px;border-radius:12px;font-size:1.15rem;font-weight:700;margin-top:20px}

/* --- СТИЛИ ДЛЯ СПИСКА ПОКУПОК --- */
.shopping-list { list-style: none; padding: 0; margin: 0; }
.shopping-list li { display: flex; align-items: center; gap: 15px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: #fff; transition: background 0.2s; }
.shopping-list li:last-child { border-bottom: none; }
.shopping-list li:hover { background: #f8fafc; }
.shopping-img { width: 44px; height: 44px; object-fit: cover; border-radius: 8px; cursor: pointer; border: 1px solid var(--border); }
.shopping-img-placeholder { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: #f0f4f8; border-radius: 8px; font-size: 1.2rem; color: #888; border: 1px solid var(--border); }
.shopping-details { flex: 1; display: flex; flex-direction: column; }
.shopping-qty { font-size: 0.9rem; color: var(--accent); font-weight: 600; margin-top: 2px;}
.shopping-check { display: flex; align-items: center; cursor: pointer; padding: 5px; }
.shopping-check input { width: 22px; height: 22px; cursor: pointer; accent-color: var(--accent); }

.breadcrumbs{margin-bottom:15px;font-size:.95rem;color:#555}
.breadcrumbs a{color:var(--accent);text-decoration:none}
.breadcrumbs a:hover{text-decoration:underline}
.week-toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:15px;font-size:.9rem}
.week-toolbar input{padding:8px;border:1px solid var(--border);border-radius:6px;font-size:.9rem}
.tile-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.tile{display:block;background:#f8fafc;border:1px solid var(--border);border-radius:10px;padding:14px;color:var(--text);text-decoration:none;transition:border-color .2s,box-shadow .2s}
.tile:hover{border-color:var(--accent);box-shadow:0 4px 10px rgba(52,152,219,.15)}
.tile.current{border-color:var(--accent);background:#eaf2f8}
.tile-title{font-weight:700;margin-bottom:4px}
.tile-sub{font-size:.85rem;color:#666}
.tile-badge{display:inline-block;font-size:.75rem;background:var(--accent);color:#fff;border-radius:999px;padding:1px 8px;margin-left:6px;vertical-align:middle}
.tile-meals{list-style:none;margin-top:8px;font-size:.85rem}
.tile-meals li{padding:2px 0;border-top:1px dashed var(--border)}
.tile-meals .time{color:#888;margin-right:6px;font-variant-numeric:tabular-nums}
.meal-card{background:var(--card-bg);border:2px solid #c8d6e5;border-radius:14px;padding:16px 18px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.meal-card .meal-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;padding-bottom:10px;margin-bottom:12px;border-bottom:1px solid var(--border);font-weight:700;font-size:1.05rem}
.meal-header input[type="time"]{padding:4px 6px;border:1px solid var(--border);border-radius:6px;font-size:.9rem;margin-left:6px}
.meal-total{font-size:.85rem;color:#555;font-weight:500}
.meal-fields{display:grid;gap:10px;margin-bottom:10px}
.meal-fields label{font-size:.85rem;color:#555;display:flex;flex-direction:column;gap:4px}
.meal-fields input[type="text"],.meal-fields textarea{padding:8px;border:1px solid var(--border);border-radius:6px;font-size:.95rem;font-family:inherit}
.meal-fields textarea{min-height:110px;resize:vertical}
.recipe-text{white-space:pre-wrap;background:#fafbfc;border:1px solid var(--border);border-radius:6px;padding:10px;font-size:.95rem}
.recipe-actions{display:flex;gap:8px;margin-top:6px}
.add-item-row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.add-item-row select,.add-item-row input{padding:8px;border:1px solid var(--border);border-radius:6px;font-size:.9rem}
.add-item-row button{padding:8px 14px;background:var(--success);color:#fff;border:none;border-radius:6px;font-weight:600}
.add-item-row button:hover{background:#27ae60}
.add-item-unit{color:#888;font-size:.85rem;align-self:center}
.day-summary{background:#2c3e50;color:#fff;padding:20px;border-radius:12px;display:flex;justify-content:space-around;flex-wrap:wrap;gap:15px;margin-top:20px}
.summary-item{text-align:center}
.summary-item .label{font-size:.8rem;opacity:.8;text-transform:uppercase;letter-spacing:1px}
.summary-item .value{font-size:1.8rem;font-weight:700}
.summary-item .goal{font-size:.85rem;opacity:.8}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:20px;z-index:250}
.modal-content{background:var(--card-bg);border-radius:14px;padding:24px;max-width:600px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px}
@media(max-width:600px){body{padding:12px}.app-header h1{font-size:1.2rem}.user-info{font-size:.8rem;padding:6px 10px}}
</style>
</head>
<body>

<!-- ============ AUTH SCREEN ============ -->
<div id="authScreen" class="auth-screen">
  <div class="container">
    <h1>🥗 Мой планировщик питания</h1>
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" data-auth="login" onclick="switchAuthTab('login')">Вход</button>
        <button class="auth-tab" data-auth="register" onclick="switchAuthTab('register')">Регистрация</button>
      </div>
      <div class="auth-panel" id="authPanel-login">
        <input type="email" id="loginPhone" placeholder="Email" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Пароль" autocomplete="current-password" onkeydown="if(event.key==='Enter')handleLogin()">
        <button class="primary-btn" onclick="handleLogin()">Войти</button>
        <div class="auth-error" id="loginError"></div>
      </div>
      <div class="auth-panel hidden" id="authPanel-register">
        <input type="email" id="regPhone" placeholder="Email" autocomplete="email">
        <input type="password" id="regPassword" placeholder="Пароль (мин. 6 символов)" autocomplete="new-password" onkeydown="if(event.key==='Enter')handleRegister()">
        <button class="primary-btn" onclick="handleRegister()">Зарегистрироваться</button>
        <div class="auth-error" id="regError"></div>
      </div>
    </div>
  </div>
</div>

<!-- ============ SIDEBAR (BURGER MENU) ============ -->
<div id="sidebarOverlay" class="sidebar-overlay" onclick="toggleSidebar()"></div>
<nav id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <span class="sidebar-title">Навигация</span>
    <button class="close-btn" onclick="toggleSidebar()">✕</button>
  </div>
  <div class="sidebar-nav">
    <a class="tab" href="#new" data-tab="new">🍽️ Меню</a>
    <a class="tab" href="#about" data-tab="about">👤 О себе</a>
    <a class="tab" href="#products" data-tab="products">🛒 Продукты</a>
    <!-- НОВЫЙ ПУНКТ МЕНЮ -->
    <a class="tab" href="#shopping" data-tab="shopping">🛍️ Список покупок</a>
    <a class="tab" href="#menu" data-tab="menu">📝 Составить меню</a>
  </div>
</nav>

<!-- ============ MAIN APP ============ -->
<div id="app" class="hidden">
  <div class="container">
    <header class="app-header">
      <div class="header-left">
        <button class="burger-btn" onclick="toggleSidebar()" aria-label="Открыть меню">☰</button>
        <h1>🥗 Мой планировщик питания</h1>
      </div>
      <div class="user-info">
        <span id="headerUserName"></span>
        <button class="small-btn" onclick="handleLogout()">Выйти</button>
      </div>
    </header>

    <!-- Меню (пустой раздел) -->
    <section class="section" id="section-new">
      <div class="card">
        <h2>Меню</h2>
        <div class="empty-msg">Здесь пока пусто. Раздел в разработке.</div>
      </div>
    </section>

    <!-- ============ РАЗДЕЛ О СЕБЕ ============ -->
    <section class="section" id="section-about">
      <div id="profilesContainer"></div>
      <div style="margin-bottom: 20px;">
        <button class="primary-btn" onclick="addNewProfile()">+ Добавить</button>
      </div>
    </section>

    <!-- ============ РАЗДЕЛ ПРОДУКТЫ ============ -->
    <section class="section" id="section-products">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:15px">
          <h2 style="margin:0;border:none;padding:0">🛒 Продукты</h2>
          <button class="primary-btn" onclick="openProductModal()">+ Добавить продукт</button>
        </div>
        <div id="productsList"></div>
      </div>
    </section>

    <!-- ============ РАЗДЕЛ СПИСОК ПОКУПОК ============ -->
    <section class="section" id="section-shopping">
      <div class="card">
        <h2>🛍️ Список покупок</h2>
        <div id="shoppingContainer"></div>
      </div>
    </section>
    
    <!-- ============ РАЗДЕЛ СОСТАВИТЬ МЕНЮ ============ -->
    <section class="section" id="section-menu">
      <div class="card" id="menuContainer"></div>
    </section>
  </div>
</div>

<!-- ============ PRODUCT MODAL ============ -->
<div id="productModal" class="modal hidden">
  <div class="modal-content">
    <h3 id="productModalTitle">Новый продукт</h3>
    <form id="productForm" onsubmit="handleProductSave(event)">
      <input type="hidden" id="editProductId">
      <input type="hidden" id="editProductImageUrl">
      <div class="form-grid">
        <label>Название *<input type="text" id="editName" required></label>
        <label>Магазин<input type="text" id="editStore"></label>
        <label>Белок (г/100г)<input type="number" id="editProtein" step="0.1" min="0" value="0"></label>
        <label>Клетчатка (г/100г)<input type="number" id="editFiber" step="0.1" min="0" value="0"></label>
        <label>Ккал (на 100г)<input type="number" id="editKcal" step="1" min="0" value="0"></label>
        <label>Единица количества
          <select id="editUnitType" onchange="updateUnitLabels()">
            <option value="g">Граммы</option>
            <option value="pc">Штуки</option>
          </select>
        </label>
        <label><span id="qtyLabelText">Количество к покупке (г)</span>
          <input type="number" id="editQty" step="0.01" min="0" value="0">
        </label>
        <label><span id="priceLabelText">Цена за 100г (₽)</span>
          <input type="number" id="editPrice" step="0.01" min="0" value="0">
        </label>
        <label id="gramPerPieceLabel" class="hidden">Граммовка 1 шт (г)
          <input type="number" id="editGramPerPiece" step="0.1" min="0" value="0">
        </label>
        <label>Фото продукта (необязательно)
          <input type="file" id="editImageFile" accept="image/*" style="padding:8px;">
        </label>
      </div>
      <div class="modal-actions">
        <button type="button" class="small-btn" onclick="closeProductModal()">Отмена</button>
        <button type="submit" class="primary-btn">Сохранить</button>
      </div>
    </form>
  </div>
</div>

<!-- ============ IMAGE VIEW MODAL ============ -->
<div id="imageModal" class="modal hidden" onclick="closeImageModal()">
  <div class="modal-content" style="max-width:90vw; max-height:90vh; background:transparent; box-shadow:none; padding:0; display:flex; justify-content:center; align-items:center;">
    <img id="fullImage" src="" style="max-width:100%; max-height:90vh; border-radius:10px; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
  </div>
</div>

<script type="module">
import {
  auth, db,
  createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
  doc, getDoc, setDoc
} from './firebase-config.js';

/* ============ CONSTANTS ============ */
const WEEKDAYS = ['Понедельник','Вторник','Среда','Четверг','Пятница','Суббота','Воскресенье'];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];

/* ============ STATE ============ */
let currentUser = null;
let profiles = [];
let products = [];
let days = {};
let menuWeek = null;
let menuDay = null;
const editingRecipes = new Set();

/* ============ UTILS ============ */
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function defaultProfile() { return { id: newId(), name:'', sex:'female', age:'', height:'', weight:'', activity:'1.375', goal:'keep' }; }
function toISO(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function fromISO(iso) { const [y,m,d] = iso.split('-').map(Number); return new Date(y, m-1, d); }
function addDays(iso, n) { const d = fromISO(iso); d.setDate(d.getDate()+n); return toISO(d); }
function mondayOf(iso) { const d = fromISO(iso); return addDays(iso, -((d.getDay()+6)%7)); }
function weekdayName(iso) { return WEEKDAYS[(fromISO(iso).getDay()+6)%7]; }
function formatDate(iso) { const d = fromISO(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }
function formatWeek(monday) { return `${formatDate(monday)} — ${formatDate(addDays(monday,6))}`; }

/* ============ СЖАТИЕ ИЗОБРАЖЕНИЙ ============ */
function compressImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxSize = 600; // Максимальный размер стороны в пикселях

        if (width > height && width > maxSize) {
          height *= maxSize / width;
          width = maxSize;
        } else if (height > maxSize) {
          width *= maxSize / height;
          height = maxSize;
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        
        // Конвертируем в Base64 формат JPEG с качеством 70%
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.onerror = () => reject(new Error('Ошибка чтения изображения'));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error('Ошибка файла'));
    reader.readAsDataURL(file);
  });
}

/* ============ FIRESTORE DATA ============ */
async function loadUserData(uid) {
  const docRef = doc(db, 'userData', uid);
  const snap = await getDoc(docRef);
  if (snap.exists()) {
    const d = snap.data();
    if (d.profiles && Array.isArray(d.profiles)) {
      profiles = d.profiles;
    } else if (d.profile) {
      profiles = [{ id: newId(), ...d.profile }];
    } else {
      profiles = [defaultProfile()];
    }
    products = Array.isArray(d.products) ? d.products : [];
    days = (d.days && typeof d.days === 'object') ? d.days : {};
  } else {
    profiles = [defaultProfile()];
    await setDoc(docRef, { profiles, products: [], days: {} });
  }
}

async function persist() {
  if (!auth.currentUser) return;
  const docRef = doc(db, 'userData', auth.currentUser.uid);
  try {
    await setDoc(docRef, { profiles, products, days }, { merge: true });
  } catch (e) {
    console.error('Ошибка сохранения:', e);
  }

function calculateNorms(p) {
  if (!p) return null;
  const age = parseFloat(p.age);
  const height = parseFloat(p.height);
  const weight = parseFloat(p.weight);
  if (!age || !height || !weight) return null;
  const bmr = 10*weight + 6.25*height - 5*age + (p.sex === 'male' ? 5 : -161);
  const tdee = bmr * parseFloat(p.activity || 1.2);
  const gf = { lose:0.85, keep:1, gain:1.15 }[p.goal] || 1;
  const ppk = { lose:1.8, keep:1.4, gain:1.8 }[p.goal] || 1.4;
  const kcal = tdee * gf;
  return { kcal, protein: weight * ppk, fiber: kcal/1000 * 14 };
}

function productSubtotal(p) {
  const q = p.qty || 0, pr = p.price || 0;
  return p.unitType === 'pc' ? q * pr : (q/100) * pr;
}
function formatQty(p) {
  const q = p.qty || 0;
  return p.unitType === 'pc' ? `${q} шт` : `${q} г`;
}
function formatPrice(p) {
  const pr = (p.price || 0).toFixed(2);
  return p.unitType === 'pc' ? `${pr} ₽/шт` : `${pr} ₽/100г`;
}

function defaultMeals() {
  return [['Завтрак','08:00'],['Перекус','11:00'],['Обед','14:00'],['Полдник','17:00'],['Ужин','19:00']]
    .map(([name,time]) => ({ id: newId(), name, time, dish:'', recipe:'', items:[] }));
}
function getDay(date) {
  if (!days[date]) days[date] = { meals: defaultMeals() };
  return days[date];
}
function findMeal(id) { return getDay(menuDay).meals.find(m => m.id === id); }
function sortedMeals(day) { return [...day.meals].sort((a,b) => (a.time||'').localeCompare(b.time||'')); }
function isPlanned(m) { return m.dish || m.recipe || (m.items && m.items.length); }

function calculateMealTotals(meal) {
  let g=0,pr=0,fi=0,kc=0;
  (meal.items||[]).forEach(it => {
    const p = products.find(x => String(x.id) === String(it.productId));
    if (!p) return;
    const f = it.grams / 100;
    g += it.grams; pr += p.protein*f; fi += p.fiber*f; kc += p.kcal*f;
  });
  return { totalGrams:g, totalProtein:pr, totalFiber:fi, totalKcal:kc };
}
function calculateDayTotals(date) {
  const t = { totalGrams:0, totalProtein:0, totalFiber:0, totalKcal:0 };
  (days[date]?.meals || []).forEach(m => {
    const mt = calculateMealTotals(m);
    Object.keys(t).forEach(k => t[k] += mt[k]);
  });
  return t;
}

function renderMenu() {
  const c = document.getElementById('menuContainer');
  if (menuDay) c.innerHTML = renderDayView(menuDay);
  else if (menuWeek) c.innerHTML = renderWeekView(menuWeek);
  else c.innerHTML = renderWeeksList();
}

function renderWeeksList() {
  const currentWeek = mondayOf(toISO(new Date()));
  const weeks = new Set([currentWeek, addDays(currentWeek,7), addDays(currentWeek,14), addDays(currentWeek,21)]);
  Object.keys(days).forEach(d => { if ((days[d].meals||[]).some(isPlanned)) weeks.add(mondayOf(d)); });
  let html = `<h2>Меню по неделям</h2>
    <div class="week-toolbar"><span>Перейти к неделе с датой:</span>
    <input type="date" onchange="goToWeek(this.value)"></div>
    <div class="tile-grid">`;
  [...weeks].sort().forEach(monday => {
    let planned = 0, kcal = 0;
    for (let i=0;i<7;i++) {
      const d = addDays(monday,i);
      if ((days[d]?.meals||[]).some(isPlanned)) planned++;
      kcal += calculateDayTotals(d).totalKcal;
    }
    html += `<a class="tile ${monday===currentWeek?'current':''}" href="#menu/${monday}">
      <div class="tile-title">${formatWeek(monday)}${monday===currentWeek?'<span class="tile-badge">сейчас</span>':''}</div>
      <div class="tile-sub">Запланировано дней: ${planned} из 7</div>
      ${planned?`<div class="tile-sub">В среднем ${(kcal/planned).toFixed(0)} ккал в день</div>`:''}
    </a>`;
  });
  return html + `</div>`;
}

function renderWeekView(monday) {
  const today = toISO(new Date());
  let html = `<div class="breadcrumbs"><a href="#menu">Меню</a> › Неделя ${formatWeek(monday)}</div>
    <div class="week-toolbar">
      <a class="small-btn" href="#menu/${addDays(monday,-7)}" style="text-decoration:none">← Предыдущая</a>
      <a class="small-btn" href="#menu/${addDays(monday,7)}" style="text-decoration:none">Следующая →</a>
    </div>
    <h2>Неделя ${formatWeek(monday)}</h2>
    <div class="tile-grid">`;
  for (let i=0;i<7;i++) {
    const d = addDays(monday,i);
    const day = days[d];
    const planned = day ? sortedMeals(day).filter(isPlanned) : [];
    const kcal = calculateDayTotals(d).totalKcal;
    html += `<a class="tile ${d===today?'current':''}" href="#menu/${monday}/${d}">
      <div class="tile-title">${WEEKDAYS[i]}${d===today?'<span class="tile-badge">сегодня</span>':''}</div>
      <div class="tile-sub">${formatDate(d)}${kcal?` · ${kcal.toFixed(0)} ккал`:''}</div>
      ${planned.length
        ? `<ul class="tile-meals">${planned.map(m=>`<li><span class="time">${esc(m.time)}</span>${esc(m.dish||m.name)}</li>`).join('')}</ul>`
        : `<div class="tile-sub" style="margin-top:8px;font-style:italic">Ничего не запланировано</div>`}
    </a>`;
  }
  return html + `</div>`;
}

function renderDayView(date) {
  const monday = mondayOf(date);
  const day = getDay(date);
  let html = `<div class="breadcrumbs">
    <a href="#menu">Меню</a> › <a href="#menu/${monday}">Неделя ${formatWeek(monday)}</a> › ${weekdayName(date)}, ${formatDate(date)}
    </div>
    <div class="week-toolbar">
      <a class="small-btn" href="#menu/${mondayOf(addDays(date,-1))}/${addDays(date,-1)}" style="text-decoration:none">← Предыдущий день</a>
      <a class="small-btn" href="#menu/${mondayOf(addDays(date,1))}/${addDays(date,1)}" style="text-decoration:none">Следующий день →</a>
    </div>
    <h2>${weekdayName(date)}, ${formatDate(date)}</h2>`;

  sortedMeals(day).forEach(meal => {
    const t = calculateMealTotals(meal);
    const id = meal.id;
    html += `<div class="meal-card">
      <div class="meal-header">
        <span>${esc(meal.name)}
          <input type="time" value="${esc(meal.time)}" onchange="updateMeal('${id}','time',this.value,true)">
        </span>
        <span class="meal-total">
          ${t.totalGrams.toFixed(0)} г · Б: ${t.totalProtein.toFixed(1)} г · Кл: ${t.totalFiber.toFixed(1)} г · ${t.totalKcal.toFixed(0)} ккал
        </span>
      </div>
      <div class="meal-fields">
        <label>Название блюда
          <input type="text" value="${esc(meal.dish)}" placeholder="Например: Омлет с овощами"
            onchange="updateMeal('${id}','dish',this.value.trim())">
        </label>
        <div>
          <label>Рецепт / план действий</label>`;
    if (editingRecipes.has(id)) {
      html += `<div style="margin-top:4px">
        <textarea id="recipe-${id}" placeholder="1. Нарезать овощи&#10;2. Взбить яйца&#10;3. Жарить 5 минут">${esc(meal.recipe)}</textarea>
      </div>
      <div class="recipe-actions">
        <button class="small-btn primary" onclick="saveRecipe('${id}')">Сохранить</button>
        <button class="small-btn" onclick="cancelRecipe('${id}')">Отмена</button>
      </div>`;
    } else if (meal.recipe) {
      html += `<div class="recipe-text" style="margin-top:4px">${esc(meal.recipe)}</div>
        <div class="recipe-actions"><button class="small-btn" onclick="editRecipe('${id}')">✏️ Редактировать</button></div>`;
    } else {
      html += `<div class="recipe-actions"><button class="small-btn" onclick="editRecipe('${id}')">+ Добавить рецепт</button></div>`;
    }
    html += `</div></div>`;

    if (!meal.items || meal.items.length === 0) {
      html += `<div class="empty-msg">Нет продуктов</div>`;
    } else {
      html += `<table><thead><tr>
        <th>Продукт</th><th>Кол-во</th><th>Белок</th><th>Клетчатка</th><th>Ккал</th><th></th>
      </tr></thead><tbody>`;
      meal.items.forEach((item, idx) => {
        const p = products.find(x => String(x.id) === String(item.productId));
        if (!p) return;
        const f = item.grams / 100;
        const qtyDisplay = p.unitType === 'pc' && p.gramPerPiece
          ? `${(item.grams / p.gramPerPiece).toFixed(2)} шт (${item.grams.toFixed(0)} г)`
          : `${item.grams} г`;
        html += `<tr>
          <td>${esc(p.name)}</td>
          <td>${qtyDisplay}</td>
          <td>${(p.protein*f).toFixed(1)} г</td>
          <td>${(p.fiber*f).toFixed(1)} г</td>
          <td>${(p.kcal*f).toFixed(0)} ккал</td>
          <td><button class="delete-btn" onclick="removeItem('${id}',${idx})">✕</button></td>
        </tr>`;
      });
      html += `</tbody></table>`;
    }

    html += `<div class="add-item-row">
      <select id="select-${id}" onchange="updateMealInputHint('${id}')">
        <option value="">-- Выберите продукт --</option>
        ${products.map(p => `<option value="${p.id}">${esc(p.name)} (${p.kcal} ккал/100г)</option>`).join('')}
      </select>
      <input type="number" id="qty-${id}" placeholder="Кол-во" style="width:90px" min="0.01" step="0.01">
      <span class="add-item-unit" id="unit-${id}"></span>
      <button onclick="addItemToMeal('${id}')">+ Добавить</button>
    </div>
    </div>`;
  });

  const t = calculateDayTotals(date);
  const firstProfile = profiles.length > 0 ? profiles[0] : null;
  const n = calculateNorms(firstProfile);
  
  const goal = v => n ? `<div class="goal">из ${v.toFixed(0)}</div>` : '';
  html += `<div class="day-summary">
    <div class="summary-item"><div class="label">Итого грамм</div><div class="value">${t.totalGrams.toFixed(0)}</div></div>
    <div class="summary-item"><div class="label">Белок (г)</div><div class="value">${t.totalProtein.toFixed(1)}</div>${n?goal(n.protein):''}</div>
    <div class="summary-item"><div class="label">Клетчатка (г)</div><div class="value">${t.totalFiber.toFixed(1)}</div>${n?goal(n.fiber):''}</div>
    <div class="summary-item"><div class="label">Ккал</div><div class="value">${t.totalKcal.toFixed(0)}</div>${n?goal(n.kcal):''}</div>
  </div>`;
  return html;
}

/* ============ NAV ============ */
function renderAll() { 
  renderAboutSection(); 
  renderProducts(); 
  renderShoppingList();
  renderMenu(); 
}

function showSection() {
  const tabs = ['new', 'about', 'products', 'shopping', 'menu'];
  const [section, week, day] = location.hash.slice(1).split('/');
  
  const current = tabs.includes(section) ? section : 'new';
  
  const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v||'');
  menuDay  = current==='menu' && isDate(day) ? day : null;
  menuWeek = current==='menu' && isDate(week) ? mondayOf(menuDay||week) : null;
  editingRecipes.clear();
  
  renderMenu();
  window.scrollTo(0,0);
  
  tabs.forEach(t => {
    document.getElementById(`section-${t}`).classList.toggle('active', t===current);
    document.querySelector(`.tab[data-tab="${t}"]`).classList.toggle('active', t===current);
  });

  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('open');
}
window.showSection = showSection;
window.addEventListener('hashchange', showSection);

/* ============ INIT / AUTH STATE ============ */
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = { id: user.uid, email: user.email };
    document.getElementById('headerUserName').textContent = user.email;
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    try {
      await loadUserData(user.uid);
    } catch (e) {
      console.error('Ошибка загрузки данных:', e);
    }

    if (!location.hash || location.hash === '#') location.hash = '#new';
    showSection();
    renderAll();
  } else {
    currentUser = null;
    profiles = [defaultProfile()];
    products = [];
    days = {};
    menuWeek = null;
    menuDay = null;
    editingRecipes.clear();

    document.getElementById('app').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
    document.getElementById('loginPhone').value = '';
    document.getElementById('loginPassword').value = '';
    document.getElementById('regPhone').value = '';
    document.getElementById('regPassword').value = '';
    document.getElementById('loginError').textContent = '';
    document.getElementById('regError').textContent = '';
  }
});
</script>
