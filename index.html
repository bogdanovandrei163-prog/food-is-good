<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой планировщик питания</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --border: #e0e6ed;
            --danger: #e74c3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            line-height: 1.5;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 25px; color: var(--text); font-weight: 700; }
        h2 { margin-bottom: 15px; font-size: 1.3rem; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }
        .form-grid input, .form-grid select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .form-grid button {
            padding: 10px 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .form-grid button:hover { background: var(--accent-hover); }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f8fafc; font-weight: 600; }
        .meal-section { margin-bottom: 25px; }
        .meal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eaf2f8;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .meal-total { font-size: 0.9rem; color: #555; }
        .add-item-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .add-item-row select, .add-item-row input {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .add-item-row button {
            padding: 8px 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .day-summary {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .summary-item { text-align: center; }
        .summary-item .label { font-size: 0.8rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }
        .summary-item .value { font-size: 1.8rem; font-weight: 700; }
        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .empty-msg { color: #888; font-style: italic; padding: 10px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🥗 Мой планировщик питания</h1>

    <!-- Добавление продукта -->
    <div class="card">
        <h2>Добавить продукт в справочник</h2>
        <div class="form-grid">
            <input type="text" id="prodName" placeholder="Название продукта">
            <input type="text" id="prodStore" placeholder="Магазин">
            <input type="number" id="prodProtein" placeholder="Белок (г) на 100г" step="0.1">
            <input type="number" id="prodFiber" placeholder="Клетчатка (г) на 100г" step="0.1">
            <input type="number" id="prodKcal" placeholder="Ккал на 100г" step="1">
            <button onclick="addProduct()">Добавить продукт</button>
        </div>
    </div>

    <!-- Справочник продуктов -->
    <div class="card">
        <h2>Справочник продуктов</h2>
        <div id="productsList"></div>
    </div>

    <!-- Меню на день -->
    <div class="card">
        <h2>Меню на день</h2>
        <div id="mealsContainer"></div>
        <div class="day-summary" id="daySummary">
            <div class="summary-item"><div class="label">Итого грамм</div><div class="value" id="totalGrams">0</div></div>
            <div class="summary-item"><div class="label">Белок (г)</div><div class="value" id="totalProtein">0</div></div>
            <div class="summary-item"><div class="label">Клетчатка (г)</div><div class="value" id="totalFiber">0</div></div>
            <div class="summary-item"><div class="label">Ккал</div><div class="value" id="totalKcal">0</div></div>
        </div>
    </div>
</div>

<script>
    // ---------- ДАННЫЕ ----------
    let products = JSON.parse(localStorage.getItem('products')) || [
        { id: 1, name: 'Куриная грудка', store: 'Пятерочка', protein: 23.6, fiber: 0, kcal: 113 },
        { id: 2, name: 'Гречка (вареная)', store: 'Магнит', protein: 3.4, fiber: 2.7, kcal: 110 },
        { id: 3, name: 'Яйцо куриное', store: 'Перекресток', protein: 12.7, fiber: 0, kcal: 143 },
        { id: 4, name: 'Овсяные хлопья', store: 'Лента', protein: 13.1, fiber: 10.6, kcal: 352 }
    ];

    let meals = JSON.parse(localStorage.getItem('meals')) || {
        breakfast: { name: 'Завтрак', time: '08:00', items: [] },
        snack1: { name: 'Перекус', time: '11:00', items: [] },
        lunch: { name: 'Обед', time: '14:00', items: [] },
        snack2: { name: 'Полдник', time: '17:00', items: [] },
        dinner: { name: 'Ужин', time: '19:00', items: [] }
    };

    // ---------- СОХРАНЕНИЕ ----------
    function saveData() {
        localStorage.setItem('products', JSON.stringify(products));
        localStorage.setItem('meals', JSON.stringify(meals));
    }

    // ---------- ПРОДУКТЫ ----------
    function addProduct() {
        const name = document.getElementById('prodName').value.trim();
        const store = document.getElementById('prodStore').value.trim();
        const protein = parseFloat(document.getElementById('prodProtein').value) || 0;
        const fiber = parseFloat(document.getElementById('prodFiber').value) || 0;
        const kcal = parseFloat(document.getElementById('prodKcal').value) || 0;

        if (!name) { alert('Введите название продукта'); return; }

        products.push({ id: Date.now(), name, store, protein, fiber, kcal });
        saveData();
        renderAll();
        // Очистка полей
        document.getElementById('prodName').value = '';
        document.getElementById('prodStore').value = '';
        document.getElementById('prodProtein').value = '';
        document.getElementById('prodFiber').value = '';
        document.getElementById('prodKcal').value = '';
    }

    function deleteProduct(id) {
        if (!confirm('Удалить продукт из справочника?')) return;
        products = products.filter(p => p.id !== id);
        // Также удаляем из меню
        Object.values(meals).forEach(meal => {
            meal.items = meal.items.filter(item => item.productId !== id);
        });
        saveData();
        renderAll();
    }

    function renderProducts() {
        const container = document.getElementById('productsList');
        if (products.length === 0) {
            container.innerHTML = '<div class="empty-msg">Справочник пуст. Добавьте продукты выше.</div>';
            return;
        }
        let html = `<table><thead><tr><th>Название</th><th>Магазин</th><th>Белок/100г</th><th>Клетчатка/100г</th><th>Ккал/100г</th><th></th></tr></thead><tbody>`;
        products.forEach(p => {
            html += `<tr>
                <td><strong>${p.name}</strong></td>
                <td>${p.store || '—'}</td>
                <td>${p.protein}</td>
                <td>${p.fiber}</td>
                <td>${p.kcal}</td>
                <td><button class="delete-btn" onclick="deleteProduct(${p.id})">✕</button></td>
            </tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    // ---------- МЕНЮ ----------
    function addItemToMeal(mealKey) {
        const select = document.getElementById(`select-${mealKey}`);
        const gramsInput = document.getElementById(`grams-${mealKey}`);
        const productId = parseInt(select.value);
        const grams = parseFloat(gramsInput.value);

        if (!productId) { alert('Выберите продукт'); return; }
        if (!grams || grams <= 0) { alert('Введите корректное количество грамм'); return; }

        const product = products.find(p => p.id === productId);
        if (!product) return;

        meals[mealKey].items.push({
            productId: product.id,
            grams: grams
        });

        saveData();
        renderAll();
        gramsInput.value = '';
        select.value = '';
    }

    function removeItem(mealKey, index) {
        meals[mealKey].items.splice(index, 1);
        saveData();
        renderAll();
    }

    function calculateMealTotals(mealKey) {
        let totalGrams = 0, totalProtein = 0, totalFiber = 0, totalKcal = 0;
        meals[mealKey].items.forEach(item => {
            const p = products.find(prod => prod.id === item.productId);
            if (!p) return;
            const factor = item.grams / 100;
            totalGrams += item.grams;
            totalProtein += p.protein * factor;
            totalFiber += p.fiber * factor;
            totalKcal += p.kcal * factor;
        });
        return { totalGrams, totalProtein, totalFiber, totalKcal };
    }

    function renderMeals() {
        const container = document.getElementById('mealsContainer');
        let html = '';

        Object.keys(meals).forEach(key => {
            const meal = meals[key];
            const totals = calculateMealTotals(key);

            html += `<div class="meal-section">`;
            html += `<div class="meal-header">
                <span>${meal.name} (${meal.time})</span>
                <span class="meal-total">
                    Итого: ${totals.totalGrams.toFixed(0)} г | 
                    Б: ${totals.totalProtein.toFixed(1)} г | 
                    Кл: ${totals.totalFiber.toFixed(1)} г | 
                    ${totals.totalKcal.toFixed(0)} ккал
                </span>
            </div>`;

            // Таблица продуктов в приеме пищи
            if (meal.items.length === 0) {
                html += `<div class="empty-msg" style="padding-left:10px;">Нет продуктов</div>`;
            } else {
                html += `<table><thead><tr><th>Продукт</th><th>Грамм</th><th>Белок</th><th>Клетчатка</th><th>Ккал</th><th></th></tr></thead><tbody>`;
                meal.items.forEach((item, idx) => {
                    const p = products.find(prod => prod.id === item.productId);
                    if (!p) return;
                    const factor = item.grams / 100;
                    html += `<tr>
                        <td>${p.name}</td>
                        <td>${item.grams} г</td>
                        <td>${(p.protein * factor).toFixed(1)} г</td>
                        <td>${(p.fiber * factor).toFixed(1)} г</td>
                        <td>${(p.kcal * factor).toFixed(0)} ккал</td>
                        <td><button class="delete-btn" onclick="removeItem('${key}', ${idx})">✕</button></td>
                    </tr>`;
                });
                html += `</tbody></table>`;
            }

            // Форма добавления продукта в прием пищи
            html += `<div class="add-item-row">
                <select id="select-${key}">
                    <option value="">-- Выберите продукт --</option>
                    ${products.map(p => `<option value="${p.id}">${p.name} (${p.kcal} ккал/100г)</option>`).join('')}
                </select>
                <input type="number" id="grams-${key}" placeholder="Грамм" style="width:90px;" min="1">
                <button onclick="addItemToMeal('${key}')">+ Добавить</button>
            </div>`;

            html += `</div>`;
        });

        container.innerHTML = html;
    }

    // ---------- ИТОГИ ЗА ДЕНЬ ----------
    function updateDaySummary() {
        let totalGrams = 0, totalProtein = 0, totalFiber = 0, totalKcal = 0;
        Object.keys(meals).forEach(key => {
            const totals = calculateMealTotals(key);
            totalGrams += totals.totalGrams;
            totalProtein += totals.totalProtein;
            totalFiber += totals.totalFiber;
            totalKcal += totals.totalKcal;
        });

        document.getElementById('totalGrams').textContent = totalGrams.toFixed(0);
        document.getElementById('totalProtein').textContent = totalProtein.toFixed(1);
        document.getElementById('totalFiber').textContent = totalFiber.toFixed(1);
        document.getElementById('totalKcal').textContent = totalKcal.toFixed(0);
    }

    // ---------- ОБЩАЯ ОТРИСОВКА ----------
    function renderAll() {
        renderProducts();
        renderMeals();
        updateDaySummary();
    }

    // Запуск
    renderAll();
</script>
</body>
</html>
