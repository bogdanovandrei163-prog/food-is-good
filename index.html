<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой планировщик питания</title>
    <style>
        :root {
            --bg: #f4f7f6;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --accent: #3498db;
            --accent-hover: #2980b9;
            --border: #e0e6ed;
            --danger: #e74c3c;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px;
            line-height: 1.5;
        }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 25px; color: var(--text); font-weight: 700; }
        h2 { margin-bottom: 15px; font-size: 1.3rem; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-bottom: 15px;
        }
        .form-grid input, .form-grid select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
        }
        .form-grid button {
            padding: 10px 15px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .form-grid button:hover, .primary-btn:hover { background: var(--accent-hover); }
        .primary-btn {
            padding: 10px 20px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.95rem;
            transition: background 0.2s;
        }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9rem; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #f8fafc; font-weight: 600; }
        .meal-section { margin-bottom: 25px; }
        .meal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #eaf2f8;
            padding: 8px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            font-weight: 600;
        }
        .meal-total { font-size: 0.9rem; color: #555; }
        .add-item-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
            flex-wrap: wrap;
        }
        .add-item-row select, .add-item-row input {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
        }
        .add-item-row button {
            padding: 8px 12px;
            background: #2ecc71;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }
        .day-summary {
            background: #2c3e50;
            color: white;
            padding: 20px;
            border-radius: 12px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 20px;
        }
        .summary-item { text-align: center; }
        .summary-item .label { font-size: 0.8rem; opacity: 0.8; text-transform: uppercase; letter-spacing: 1px; }
        .summary-item .value { font-size: 1.8rem; font-weight: 700; }
        .delete-btn {
            background: var(--danger);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        .empty-msg { color: #888; font-style: italic; padding: 10px; }
        .tabs {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .tab {
            padding: 10px 20px;
            border: 1px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            border-radius: 999px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, color 0.2s;
        }
        .tab:hover { background: #eaf2f8; }
        .tab.active { background: var(--accent); border-color: var(--accent); color: white; }
        .section { display: none; }
        .section.active { display: block; }
        .form-grid label { display: flex; flex-direction: column; gap: 4px; font-size: 0.85rem; color: #555; }
        .norms {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }
        .norm {
            background: #eaf2f8;
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .norm .label { font-size: 0.8rem; color: #555; text-transform: uppercase; letter-spacing: 1px; }
        .norm .value { font-size: 1.6rem; font-weight: 700; }
        .summary-item .goal { font-size: 0.85rem; opacity: 0.8; }
        .saved-msg { color: #2ecc71; font-weight: 600; margin-left: 10px; opacity: 0; transition: opacity 0.3s; }
        .saved-msg.show { opacity: 1; }
        .breadcrumbs { margin-bottom: 15px; font-size: 0.95rem; color: #555; }
        .breadcrumbs a { color: var(--accent); text-decoration: none; }
        .breadcrumbs a:hover { text-decoration: underline; }
        .week-toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 15px; font-size: 0.9rem; }
        .week-toolbar input { padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.9rem; }
        .tile-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
            gap: 12px;
        }
        .tile {
            display: block;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px;
            color: var(--text);
            text-decoration: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .tile:hover { border-color: var(--accent); box-shadow: 0 4px 10px rgba(52,152,219,0.15); }
        .tile.current { border-color: var(--accent); background: #eaf2f8; }
        .tile-title { font-weight: 700; margin-bottom: 4px; }
        .tile-sub { font-size: 0.85rem; color: #666; }
        .tile-badge { display: inline-block; font-size: 0.75rem; background: var(--accent); color: white; border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: middle; }
        .tile-meals { list-style: none; margin-top: 8px; font-size: 0.85rem; }
        .tile-meals li { padding: 2px 0; border-top: 1px dashed var(--border); }
        .tile-meals .time { color: #888; margin-right: 6px; font-variant-numeric: tabular-nums; }
        .meal-header input[type="time"] {
            padding: 4px 6px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            margin-left: 6px;
        }
        .meal-fields { display: grid; gap: 10px; margin-bottom: 10px; padding: 0 4px; }
        .meal-fields label { font-size: 0.85rem; color: #555; display: flex; flex-direction: column; gap: 4px; }
        .meal-fields input[type="text"], .meal-fields textarea {
            padding: 8px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.95rem;
            font-family: inherit;
        }
        .meal-fields textarea { min-height: 110px; resize: vertical; }
        .recipe-text { white-space: pre-wrap; background: #fafbfc; border: 1px solid var(--border); border-radius: 6px; padding: 10px; font-size: 0.95rem; }
        .recipe-actions { display: flex; gap: 8px; margin-top: 6px; }
        .small-btn {
            padding: 6px 12px;
            border: 1px solid var(--border);
            background: white;
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .small-btn.primary { background: var(--accent); border-color: var(--accent); color: white; }
    </style>
</head>
<body>
<div class="container">
    <h1>🥗 Мой планировщик питания</h1>

    <nav class="tabs">
        <a class="tab" href="#about" data-tab="about">👤 О себе</a>
        <a class="tab" href="#products" data-tab="products">🛒 Список продуктов</a>
        <a class="tab" href="#menu" data-tab="menu">🍽️ Меню</a>
    </nav>

    <!-- ===== О СЕБЕ ===== -->
    <section class="section" id="section-about">
        <div class="card">
            <h2>Мои данные</h2>
            <div class="form-grid">
                <label>Имя<input type="text" id="profName" placeholder="Как вас зовут"></label>
                <label>Пол
                    <select id="profSex">
                        <option value="female">Женский</option>
                        <option value="male">Мужской</option>
                    </select>
                </label>
                <label>Возраст (лет)<input type="number" id="profAge" min="1" step="1"></label>
                <label>Рост (см)<input type="number" id="profHeight" min="1" step="1"></label>
                <label>Вес (кг)<input type="number" id="profWeight" min="1" step="0.1"></label>
                <label>Активность
                    <select id="profActivity">
                        <option value="1.2">Минимальная</option>
                        <option value="1.375">Лёгкая (1–3 тренировки)</option>
                        <option value="1.55">Средняя (3–5 тренировок)</option>
                        <option value="1.725">Высокая (6–7 тренировок)</option>
                        <option value="1.9">Очень высокая</option>
                    </select>
                </label>
                <label>Цель
                    <select id="profGoal">
                        <option value="lose">Похудение</option>
                        <option value="keep">Поддержание веса</option>
                        <option value="gain">Набор массы</option>
                    </select>
                </label>
            </div>
            <button class="primary-btn" onclick="saveProfile()">Сохранить</button>
            <span class="saved-msg" id="savedMsg">✓ Сохранено</span>
        </div>

        <div class="card">
            <h2>Моя дневная норма</h2>
            <div id="normsContainer"></div>
        </div>
    </section>

    <!-- ===== СПИСОК ПРОДУКТОВ ===== -->
    <section class="section" id="section-products">
        <div class="card">
            <h2>Добавить продукт</h2>
            <div class="form-grid">
                <input type="text" id="prodName" placeholder="Название продукта">
                <input type="text" id="prodStore" placeholder="Магазин">
                <input type="number" id="prodProtein" placeholder="Белок (г) на 100г" step="0.1">
                <input type="number" id="prodFiber" placeholder="Клетчатка (г) на 100г" step="0.1">
                <input type="number" id="prodKcal" placeholder="Ккал на 100г" step="1">
                <button onclick="addProduct()">Добавить продукт</button>
            </div>
        </div>

        <div class="card">
            <h2>Список продуктов</h2>
            <div id="productsList"></div>
        </div>
    </section>

    <!-- ===== МЕНЮ ===== -->
    <section class="section" id="section-menu">
        <div class="card" id="menuContainer"></div>
    </section>
</div>

<script>
    // ---------- ДАННЫЕ ----------
    let products = JSON.parse(localStorage.getItem('products')) || [
        { id: 1, name: 'Куриная грудка', store: 'Пятерочка', protein: 23.6, fiber: 0, kcal: 113 },
        { id: 2, name: 'Гречка (вареная)', store: 'Магнит', protein: 3.4, fiber: 2.7, kcal: 110 },
        { id: 3, name: 'Яйцо куриное', store: 'Перекресток', protein: 12.7, fiber: 0, kcal: 143 },
        { id: 4, name: 'Овсяные хлопья', store: 'Лента', protein: 13.1, fiber: 10.6, kcal: 352 }
    ];

    // Меню по дням: { 'ГГГГ-ММ-ДД': { meals: [{ id, name, time, dish, recipe, items }] } }
    let days = JSON.parse(localStorage.getItem('days')) || {};

    function newId() {
        return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    }

    function defaultMeals() {
        return [
            ['Завтрак', '08:00'], ['Перекус', '11:00'], ['Обед', '14:00'],
            ['Полдник', '17:00'], ['Ужин', '19:00']
        ].map(([name, time]) => ({ id: newId(), name, time, dish: '', recipe: '', items: [] }));
    }

    // Перенос старого меню (без дат) на сегодняшний день
    const legacyMeals = JSON.parse(localStorage.getItem('meals'));
    if (legacyMeals && !localStorage.getItem('days')) {
        days[toISO(new Date())] = {
            meals: Object.values(legacyMeals).map(m => ({
                id: newId(), name: m.name, time: m.time, dish: '', recipe: '', items: m.items || []
            }))
        };
    }

    let profile = JSON.parse(localStorage.getItem('profile')) || {
        name: '', sex: 'female', age: '', height: '', weight: '', activity: '1.375', goal: 'keep'
    };

    // ---------- СОХРАНЕНИЕ ----------
    function saveData() {
        localStorage.setItem('products', JSON.stringify(products));
        localStorage.setItem('days', JSON.stringify(days));
        localStorage.setItem('profile', JSON.stringify(profile));
    }

    // ---------- О СЕБЕ ----------
    const profileFields = {
        name: 'profName', sex: 'profSex', age: 'profAge', height: 'profHeight',
        weight: 'profWeight', activity: 'profActivity', goal: 'profGoal'
    };

    function fillProfileForm() {
        Object.entries(profileFields).forEach(([key, id]) => {
            document.getElementById(id).value = profile[key] ?? '';
        });
    }

    function saveProfile() {
        Object.entries(profileFields).forEach(([key, id]) => {
            profile[key] = document.getElementById(id).value.trim();
        });
        saveData();
        renderAll();
        const msg = document.getElementById('savedMsg');
        msg.classList.add('show');
        setTimeout(() => msg.classList.remove('show'), 1500);
    }

    // Дневная норма по формуле Миффлина — Сан Жеора
    function calculateNorms() {
        const age = parseFloat(profile.age);
        const height = parseFloat(profile.height);
        const weight = parseFloat(profile.weight);
        if (!age || !height || !weight) return null;

        const bmr = 10 * weight + 6.25 * height - 5 * age + (profile.sex === 'male' ? 5 : -161);
        const tdee = bmr * parseFloat(profile.activity || 1.2);
        const goalFactor = { lose: 0.85, keep: 1, gain: 1.15 }[profile.goal] || 1;
        const proteinPerKg = { lose: 1.8, keep: 1.4, gain: 1.8 }[profile.goal] || 1.4;
        const kcal = tdee * goalFactor;

        return {
            kcal,
            protein: weight * proteinPerKg,
            fiber: kcal / 1000 * 14
        };
    }

    function renderNorms() {
        const container = document.getElementById('normsContainer');
        const norms = calculateNorms();
        if (!norms) {
            container.innerHTML = '<div class="empty-msg">Укажите возраст, рост и вес, чтобы рассчитать норму.</div>';
            return;
        }
        container.innerHTML = `<div class="norms">
            <div class="norm"><div class="label">Ккал</div><div class="value">${norms.kcal.toFixed(0)}</div></div>
            <div class="norm"><div class="label">Белок (г)</div><div class="value">${norms.protein.toFixed(0)}</div></div>
            <div class="norm"><div class="label">Клетчатка (г)</div><div class="value">${norms.fiber.toFixed(0)}</div></div>
        </div>`;
    }

    // ---------- ПРОДУКТЫ ----------
    function addProduct() {
        const name = document.getElementById('prodName').value.trim();
        const store = document.getElementById('prodStore').value.trim();
        const protein = parseFloat(document.getElementById('prodProtein').value) || 0;
        const fiber = parseFloat(document.getElementById('prodFiber').value) || 0;
        const kcal = parseFloat(document.getElementById('prodKcal').value) || 0;

        if (!name) { alert('Введите название продукта'); return; }

        products.push({ id: Date.now(), name, store, protein, fiber, kcal });
        saveData();
        renderAll();
        // Очистка полей
        document.getElementById('prodName').value = '';
        document.getElementById('prodStore').value = '';
        document.getElementById('prodProtein').value = '';
        document.getElementById('prodFiber').value = '';
        document.getElementById('prodKcal').value = '';
    }

    function deleteProduct(id) {
        if (!confirm('Удалить продукт из справочника?')) return;
        products = products.filter(p => p.id !== id);
        // Также удаляем из меню
        Object.values(days).forEach(day => day.meals.forEach(meal => {
            meal.items = meal.items.filter(item => item.productId !== id);
        }));
        saveData();
        renderAll();
    }

    function renderProducts() {
        const container = document.getElementById('productsList');
        if (products.length === 0) {
            container.innerHTML = '<div class="empty-msg">Список пуст. Добавьте продукты выше.</div>';
            return;
        }
        let html = `<table><thead><tr><th>Название</th><th>Магазин</th><th>Белок/100г</th><th>Клетчатка/100г</th><th>Ккал/100г</th><th></th></tr></thead><tbody>`;
        products.forEach(p => {
            html += `<tr>
                <td><strong>${p.name}</strong></td>
                <td>${p.store || '—'}</td>
                <td>${p.protein}</td>
                <td>${p.fiber}</td>
                <td>${p.kcal}</td>
                <td><button class="delete-btn" onclick="deleteProduct(${p.id})">✕</button></td>
            </tr>`;
        });
        html += `</tbody></table>`;
        container.innerHTML = html;
    }

    // ---------- ДАТЫ ----------
    const WEEKDAYS = ['Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота', 'Воскресенье'];
    const MONTHS = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];

    function toISO(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function fromISO(iso) {
        const [y, m, d] = iso.split('-').map(Number);
        return new Date(y, m - 1, d);
    }
    function addDays(iso, n) {
        const d = fromISO(iso);
        d.setDate(d.getDate() + n);
        return toISO(d);
    }
    function mondayOf(iso) {
        const d = fromISO(iso);
        return addDays(iso, -((d.getDay() + 6) % 7));
    }
    function weekdayName(iso) { return WEEKDAYS[(fromISO(iso).getDay() + 6) % 7]; }
    function formatDate(iso) { const d = fromISO(iso); return `${d.getDate()} ${MONTHS[d.getMonth()]}`; }
    function formatWeek(monday) { return `${formatDate(monday)} — ${formatDate(addDays(monday, 6))}`; }

    function esc(str) {
        return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }

    // ---------- МЕНЮ: ДАННЫЕ ----------
    let menuWeek = null;           // понедельник выбранной недели
    let menuDay = null;            // выбранный день
    const editingRecipes = new Set();

    function getDay(date) {
        if (!days[date]) days[date] = { meals: defaultMeals() };
        return days[date];
    }
    function findMeal(mealId) {
        return getDay(menuDay).meals.find(m => m.id === mealId);
    }
    function sortedMeals(day) {
        return [...day.meals].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
    }
    function isPlanned(meal) {
        return meal.dish || meal.recipe || meal.items.length;
    }

    function calculateMealTotals(meal) {
        let totalGrams = 0, totalProtein = 0, totalFiber = 0, totalKcal = 0;
        meal.items.forEach(item => {
            const p = products.find(prod => prod.id === item.productId);
            if (!p) return;
            const factor = item.grams / 100;
            totalGrams += item.grams;
            totalProtein += p.protein * factor;
            totalFiber += p.fiber * factor;
            totalKcal += p.kcal * factor;
        });
        return { totalGrams, totalProtein, totalFiber, totalKcal };
    }

    function calculateDayTotals(date) {
        const totals = { totalGrams: 0, totalProtein: 0, totalFiber: 0, totalKcal: 0 };
        (days[date]?.meals || []).forEach(meal => {
            const t = calculateMealTotals(meal);
            Object.keys(totals).forEach(k => totals[k] += t[k]);
        });
        return totals;
    }

    // ---------- МЕНЮ: ДЕЙСТВИЯ ----------
    function addItemToMeal(mealId) {
        const select = document.getElementById(`select-${mealId}`);
        const gramsInput = document.getElementById(`grams-${mealId}`);
        const productId = parseInt(select.value);
        const grams = parseFloat(gramsInput.value);

        if (!productId) { alert('Выберите продукт'); return; }
        if (!grams || grams <= 0) { alert('Введите корректное количество грамм'); return; }

        const product = products.find(p => p.id === productId);
        if (!product) return;

        findMeal(mealId).items.push({ productId: product.id, grams });
        saveData();
        renderAll();
    }

    function removeItem(mealId, index) {
        findMeal(mealId).items.splice(index, 1);
        saveData();
        renderAll();
    }

    function updateMeal(mealId, field, value, rerender) {
        findMeal(mealId)[field] = value;
        saveData();
        if (rerender) renderAll();
    }

    function editRecipe(mealId) {
        editingRecipes.add(mealId);
        renderAll();
        document.getElementById(`recipe-${mealId}`)?.focus();
    }
    function saveRecipe(mealId) {
        findMeal(mealId).recipe = document.getElementById(`recipe-${mealId}`).value.trim();
        editingRecipes.delete(mealId);
        saveData();
        renderAll();
    }
    function cancelRecipe(mealId) {
        editingRecipes.delete(mealId);
        renderAll();
    }

    function goToWeek(dateValue) {
        if (dateValue) location.hash = `menu/${mondayOf(dateValue)}`;
    }

    // ---------- МЕНЮ: ОТРИСОВКА ----------
    function renderMenu() {
        const container = document.getElementById('menuContainer');
        if (menuDay) container.innerHTML = renderDayView(menuDay);
        else if (menuWeek) container.innerHTML = renderWeekView(menuWeek);
        else container.innerHTML = renderWeeksList();
    }

    function renderWeeksList() {
        const currentWeek = mondayOf(toISO(new Date()));
        const weeks = new Set([currentWeek, addDays(currentWeek, 7), addDays(currentWeek, 14), addDays(currentWeek, 21)]);
        Object.keys(days).forEach(date => {
            if (days[date].meals.some(isPlanned)) weeks.add(mondayOf(date));
        });

        let html = `<h2>Меню по неделям</h2>
            <div class="week-toolbar">
                <span>Перейти к неделе с датой:</span>
                <input type="date" onchange="goToWeek(this.value)">
            </div>
            <div class="tile-grid">`;
        [...weeks].sort().forEach(monday => {
            let planned = 0, kcal = 0;
            for (let i = 0; i < 7; i++) {
                const date = addDays(monday, i);
                if (days[date]?.meals.some(isPlanned)) planned++;
                kcal += calculateDayTotals(date).totalKcal;
            }
            html += `<a class="tile ${monday === currentWeek ? 'current' : ''}" href="#menu/${monday}">
                <div class="tile-title">${formatWeek(monday)}${monday === currentWeek ? '<span class="tile-badge">сейчас</span>' : ''}</div>
                <div class="tile-sub">Запланировано дней: ${planned} из 7</div>
                ${planned ? `<div class="tile-sub">В среднем ${(kcal / planned).toFixed(0)} ккал в день</div>` : ''}
            </a>`;
        });
        return html + `</div>`;
    }

    function renderWeekView(monday) {
        const today = toISO(new Date());
        let html = `<div class="breadcrumbs"><a href="#menu">Меню</a> › Неделя ${formatWeek(monday)}</div>
            <div class="week-toolbar">
                <a class="small-btn" href="#menu/${addDays(monday, -7)}" style="text-decoration:none">← Предыдущая</a>
                <a class="small-btn" href="#menu/${addDays(monday, 7)}" style="text-decoration:none">Следующая →</a>
            </div>
            <h2>Неделя ${formatWeek(monday)}</h2>
            <div class="tile-grid">`;
        for (let i = 0; i < 7; i++) {
            const date = addDays(monday, i);
            const day = days[date];
            const planned = day ? sortedMeals(day).filter(isPlanned) : [];
            const kcal = calculateDayTotals(date).totalKcal;
            html += `<a class="tile ${date === today ? 'current' : ''}" href="#menu/${monday}/${date}">
                <div class="tile-title">${WEEKDAYS[i]}${date === today ? '<span class="tile-badge">сегодня</span>' : ''}</div>
                <div class="tile-sub">${formatDate(date)}${kcal ? ` · ${kcal.toFixed(0)} ккал` : ''}</div>
                ${planned.length
                    ? `<ul class="tile-meals">${planned.map(m => `<li><span class="time">${esc(m.time)}</span>${esc(m.dish || m.name)}</li>`).join('')}</ul>`
                    : `<div class="tile-sub" style="margin-top:8px;font-style:italic">Ничего не запланировано</div>`}
            </a>`;
        }
        return html + `</div>`;
    }

    function renderDayView(date) {
        const monday = mondayOf(date);
        const day = getDay(date);
        let html = `<div class="breadcrumbs">
                <a href="#menu">Меню</a> › <a href="#menu/${monday}">Неделя ${formatWeek(monday)}</a> › ${weekdayName(date)}, ${formatDate(date)}
            </div>
            <div class="week-toolbar">
                <a class="small-btn" href="#menu/${mondayOf(addDays(date, -1))}/${addDays(date, -1)}" style="text-decoration:none">← Предыдущий день</a>
                <a class="small-btn" href="#menu/${mondayOf(addDays(date, 1))}/${addDays(date, 1)}" style="text-decoration:none">Следующий день →</a>
            </div>
            <h2>${weekdayName(date)}, ${formatDate(date)}</h2>`;

        sortedMeals(day).forEach(meal => {
            const totals = calculateMealTotals(meal);
            const id = meal.id;

            html += `<div class="meal-section">
                <div class="meal-header">
                    <span>${esc(meal.name)}<input type="time" value="${esc(meal.time)}" onchange="updateMeal('${id}', 'time', this.value, true)"></span>
                    <span class="meal-total">
                        Итого: ${totals.totalGrams.toFixed(0)} г |
                        Б: ${totals.totalProtein.toFixed(1)} г |
                        Кл: ${totals.totalFiber.toFixed(1)} г |
                        ${totals.totalKcal.toFixed(0)} ккал
                    </span>
                </div>
                <div class="meal-fields">
                    <label>Название блюда
                        <input type="text" value="${esc(meal.dish)}" placeholder="Например: Омлет с овощами" onchange="updateMeal('${id}', 'dish', this.value.trim())">
                    </label>
                    <div>
                        <label>Рецепт / план действий</label>`;
            if (editingRecipes.has(id)) {
                html += `<div class="meal-fields" style="padding:0;margin:4px 0 0">
                        <textarea id="recipe-${id}" placeholder="1. Нарезать овощи&#10;2. Взбить яйца&#10;3. Жарить 5 минут под крышкой">${esc(meal.recipe)}</textarea>
                    </div>
                    <div class="recipe-actions">
                        <button class="small-btn primary" onclick="saveRecipe('${id}')">Сохранить</button>
                        <button class="small-btn" onclick="cancelRecipe('${id}')">Отмена</button>
                    </div>`;
            } else if (meal.recipe) {
                html += `<div class="recipe-text" style="margin-top:4px">${esc(meal.recipe)}</div>
                    <div class="recipe-actions"><button class="small-btn" onclick="editRecipe('${id}')">✏️ Редактировать</button></div>`;
            } else {
                html += `<div class="recipe-actions"><button class="small-btn" onclick="editRecipe('${id}')">+ Добавить рецепт</button></div>`;
            }
            html += `</div></div>`;

            // Таблица продуктов в приеме пищи
            if (meal.items.length === 0) {
                html += `<div class="empty-msg" style="padding-left:10px;">Нет продуктов</div>`;
            } else {
                html += `<table><thead><tr><th>Продукт</th><th>Грамм</th><th>Белок</th><th>Клетчатка</th><th>Ккал</th><th></th></tr></thead><tbody>`;
                meal.items.forEach((item, idx) => {
                    const p = products.find(prod => prod.id === item.productId);
                    if (!p) return;
                    const factor = item.grams / 100;
                    html += `<tr>
                        <td>${esc(p.name)}</td>
                        <td>${item.grams} г</td>
                        <td>${(p.protein * factor).toFixed(1)} г</td>
                        <td>${(p.fiber * factor).toFixed(1)} г</td>
                        <td>${(p.kcal * factor).toFixed(0)} ккал</td>
                        <td><button class="delete-btn" onclick="removeItem('${id}', ${idx})">✕</button></td>
                    </tr>`;
                });
                html += `</tbody></table>`;
            }

            // Форма добавления продукта в прием пищи
            html += `<div class="add-item-row">
                <select id="select-${id}">
                    <option value="">-- Выберите продукт --</option>
                    ${products.map(p => `<option value="${p.id}">${esc(p.name)} (${p.kcal} ккал/100г)</option>`).join('')}
                </select>
                <input type="number" id="grams-${id}" placeholder="Грамм" style="width:90px;" min="1">
                <button onclick="addItemToMeal('${id}')">+ Добавить</button>
            </div>`;

            html += `</div>`;
        });

        // Итоги за день
        const t = calculateDayTotals(date);
        const norms = calculateNorms();
        const goal = v => norms ? `<div class="goal">из ${v.toFixed(0)}</div>` : '';
        html += `<div class="day-summary">
            <div class="summary-item"><div class="label">Итого грамм</div><div class="value">${t.totalGrams.toFixed(0)}</div></div>
            <div class="summary-item"><div class="label">Белок (г)</div><div class="value">${t.totalProtein.toFixed(1)}</div>${norms ? goal(norms.protein) : ''}</div>
            <div class="summary-item"><div class="label">Клетчатка (г)</div><div class="value">${t.totalFiber.toFixed(1)}</div>${norms ? goal(norms.fiber) : ''}</div>
            <div class="summary-item"><div class="label">Ккал</div><div class="value">${t.totalKcal.toFixed(0)}</div>${norms ? goal(norms.kcal) : ''}</div>
        </div>`;
        return html;
    }

    // ---------- ОБЩАЯ ОТРИСОВКА ----------
    function renderAll() {
        renderNorms();
        renderProducts();
        renderMenu();
    }

    // ---------- РАЗДЕЛЫ ----------
    function showSection() {
        const tabs = ['about', 'products', 'menu'];
        const [section, week, day] = location.hash.slice(1).split('/');
        const current = tabs.includes(section) ? section : 'menu';
        const isDate = v => /^\d{4}-\d{2}-\d{2}$/.test(v || '');

        menuDay = current === 'menu' && isDate(day) ? day : null;
        menuWeek = current === 'menu' && isDate(week) ? mondayOf(menuDay || week) : null;
        editingRecipes.clear();
        renderMenu();
        window.scrollTo(0, 0);

        tabs.forEach(t => {
            document.getElementById(`section-${t}`).classList.toggle('active', t === current);
            document.querySelector(`.tab[data-tab="${t}"]`).classList.toggle('active', t === current);
        });
    }
    window.addEventListener('hashchange', showSection);

    // Запуск
    fillProfileForm();
    showSection();
    renderAll();
</script>
</body>
</html>
